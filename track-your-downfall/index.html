<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: one phone-width column, sticky top bar, fixed bottom tab bar; single deliberate dark "night-owl neon" look */
:root {
  --bg: #100b1a;
  --bg-2: #1a1228;
  --card: #211833;
  --card-2: #2a1f40;
  --line: #3a2d55;
  --fg: #f4eefc;
  --muted: #a99bc4;
  --pink: #ff4f9a;
  --cyan: #37e6d3;
  --amber: #ffc24b;
  --good: #59e39a;
  --bad: #ff5e6c;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 10px; padding-block: 14px 10px; }
.brand { font-family: var(--display); font-weight: 900; font-size: 15px; letter-spacing: -.01em; line-height: 1.05; flex: 1; min-width: 0; }
.brand span { color: var(--pink); }
.me-chip { display: flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 6px; font-size: 13px; font-weight: 600; max-width: 55%; }
.me-chip b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.ava { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--card-2); font-size: 16px; flex: none; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.15; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* Aura hero */
.hero { position: relative; overflow: hidden; padding: 22px 18px 18px; background: radial-gradient(120% 90% at 100% 0%, rgba(255,79,154,.28), transparent 60%), radial-gradient(90% 80% at 0% 100%, rgba(55,230,211,.18), transparent 60%), var(--card); }
.aura-num { font-family: var(--display); font-weight: 900; font-size: clamp(54px, 18vw, 76px); line-height: .95; letter-spacing: -.04em; font-variant-numeric: tabular-nums; margin-top: 6px; }
.aura-num.neg { color: var(--bad); }
.rank { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size: 13px; background: rgba(255,255,255,.07); border: 1px solid var(--line); }
.delta { font-weight: 700; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); }
.hero-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.roast-card { border-color: rgba(255,79,154,.45); }
.roast-text { font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.3; margin-top: 8px; }
.soft-card { border-color: rgba(55,230,211,.45); }
.fix { display: flex; gap: 12px; align-items: flex-start; }
.fix .ic { font-size: 26px; line-height: 1; }

.cta { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px 18px; border-radius: 14px; font-weight: 800; font-size: 16px; background: var(--pink); color: #1a0812; box-shadow: 0 6px 24px rgba(255,79,154,.35); }
.cta.alt { background: var(--cyan); color: #04201d; box-shadow: 0 6px 24px rgba(55,230,211,.25); }
.cta.ghost { background: var(--card-2); color: var(--fg); box-shadow: none; border: 1px solid var(--line); }
.cta:disabled { opacity: .4; cursor: default; }
.link { color: var(--cyan); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 110px; margin-top: 12px; }
.bar { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; min-width: 0; }
.bar i { display: block; width: 100%; max-width: 30px; border-radius: 6px 6px 3px 3px; background: var(--cyan); min-height: 4px; }
.bar i.low { background: var(--bad); } .bar i.none { background: var(--line); }
.bar span { font-size: 11px; color: var(--muted); }
.bar em { font-style: normal; font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }

.nudge { background: linear-gradient(135deg, #2b1640, #17213d); border: 1px solid #4d3a78; border-radius: var(--r); padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
.nudge .ic { font-size: 28px; }

/* Damage report */
.progress { height: 6px; background: var(--card-2); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--pink), var(--amber)); border-radius: 99px; transition: width .25s; }
.q-title { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.15; margin-top: 18px; }
.opts { display: grid; gap: 10px; margin-top: 18px; }
.opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; border-radius: 14px; background: var(--card); border: 1.5px solid var(--line); font-weight: 600; font-size: 16px; transition: transform .12s, border-color .12s, background .12s; }
.opt .em { font-size: 26px; width: 34px; text-align: center; flex: none; }
.opt .lbl { flex: 1; min-width: 0; }
.opt .pts { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; padding: 3px 8px; border-radius: 99px; background: var(--card-2); }
.opt .pts.p { color: var(--good); } .opt .pts.n { color: var(--bad); }
.opt:active { transform: scale(.98); }
.opt.on { border-color: var(--pink); background: #3a1a35; }
.opt-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr)); }
.opt-grid .opt { flex-direction: column; text-align: center; gap: 6px; padding: 16px 10px; }
.opt-grid .opt .em { width: auto; }
.back-row { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }

/* Quests and graveyard */
.quest { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); width: 100%; text-align: left; }
.quest .box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--muted); flex: none; display: grid; place-items: center; font-weight: 900; }
.quest.done .box { background: var(--good); border-color: var(--good); color: #062014; }
.quest.done .qt { text-decoration: line-through; color: var(--muted); }
.quest .qt { flex: 1; min-width: 0; font-weight: 600; }
.quest .xp { font-size: 12px; font-weight: 800; color: var(--amber); }
.graves { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 9rem), 1fr)); gap: 10px; }
.grave { background: linear-gradient(180deg, #3a3350, #262036); border: 1px solid #4b4266; border-radius: 60px 60px 10px 10px; padding: 22px 12px 14px; text-align: center; min-width: 0; }
.grave .rip { font-family: var(--display); font-weight: 900; font-size: 18px; color: #cfc5e6; letter-spacing: .08em; }
.grave .gn { font-weight: 700; margin-top: 6px; line-height: 1.2; }
.grave .gd { font-size: 12px; color: var(--muted); margin-top: 6px; }
.alive { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--card-2); border: 1px solid var(--line); font-size: 13px; font-weight: 600; }

/* Squad */
.lb { display: flex; flex-direction: column; gap: 8px; }
.lb-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); width: 100%; text-align: left; }
.lb-row.me { border-color: var(--cyan); }
.lb-pos { font-family: var(--display); font-weight: 900; width: 24px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.lb-main { flex: 1; min-width: 0; }
.lb-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-sub { font-size: 12px; color: var(--muted); }
.lb-aura { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; }
.badges { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9rem), 1fr)); gap: 10px; }
.badge { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0; }
.badge .bt { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.badge .bn { font-weight: 700; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(5,2,10,.7); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; max-height: 88%; overflow: auto; background: var(--bg-2); border: 1px solid var(--line); border-bottom: 0; border-radius: 24px 24px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet-head { display: flex; align-items: center; gap: 12px; }
.sheet-head .x { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; background: var(--card); font-size: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 13px; font-weight: 600; text-align: left; }
.chip.on { border-color: var(--pink); background: #3a1a35; }
textarea, input[type=text] { width: 100%; background: var(--card); color: var(--fg); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; font: inherit; font-size: 16px; resize: none; }
.count { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.count.over { color: var(--bad); }
.roast-item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.roast-item .rt { font-weight: 600; overflow-wrap: anywhere; }
.roast-item .rm { display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.roast-item .rm button { font-size: 12px; font-weight: 700; color: var(--muted); padding: 4px 0; }
.roast-item .rm button:hover { color: var(--fg); }
.err { color: var(--bad); font-size: 13px; font-weight: 600; }

/* Wrapped */
.story { position: relative; border-radius: 24px; padding: 26px 22px; min-height: 380px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; overflow: hidden; }
.story.s0 { background: linear-gradient(160deg, #ff4f9a, #7b2ff7); }
.story.s1 { background: linear-gradient(160deg, #1f8f86, #1b2a6b); }
.story.s2 { background: linear-gradient(160deg, #ff8a3d, #c3245b); }
.story.s3 { background: linear-gradient(160deg, #3b2f6e, #0f0a1c); }
.story.s4 { background: linear-gradient(160deg, #e6c23a, #c2410c); }
.story .sk { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
.story .big { font-family: var(--display); font-weight: 900; font-size: clamp(44px, 15vw, 64px); line-height: .95; letter-spacing: -.03em; overflow-wrap: anywhere; }
.story .line { font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.2; }
.story .foot { font-size: 13px; opacity: .85; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--pink); width: 22px; border-radius: 99px; }
.story-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Onboarding */
.ob { min-height: 100%; display: flex; flex-direction: column; gap: 18px; padding-top: 18px; }
.ob-step { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--pink); }
.ob h1 { font-family: var(--display); font-weight: 900; font-size: clamp(26px, 8vw, 34px); line-height: 1.08; letter-spacing: -.02em; }
.splash { text-align: left; padding-top: 30px; }
.splash .logo { font-family: var(--display); font-weight: 900; font-size: clamp(42px, 14vw, 60px); line-height: .92; letter-spacing: -.04em; }
.splash .logo span { color: var(--pink); display: block; }
.reveal { background: radial-gradient(120% 90% at 100% 0%, rgba(255,79,154,.35), transparent 60%), var(--card); border: 1px solid rgba(255,79,154,.5); border-radius: 24px; padding: 24px 20px; }
.reveal .em { font-size: 54px; }
.reveal p.story-text { font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.3; margin-top: 10px; }
.reveal .prophecy { margin-top: 14px; color: var(--amber); font-weight: 700; }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: rgba(16,11,26,.94); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; font-size: 11px; font-weight: 700; color: var(--muted); position: relative; }
.tab .ti { font-size: 22px; line-height: 1.1; filter: grayscale(.6); }
.tab.on { color: var(--fg); background: var(--card); }
.tab.on .ti { filter: none; }
.tab .dot { position: absolute; top: 4px; right: calc(50% - 18px); width: 9px; height: 9px; border-radius: 50%; background: var(--pink); border: 2px solid var(--bg); }

.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); text-align: center; }
.credit { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 18px 0 4px; text-align: center; font-size: 13px; color: var(--muted); text-decoration: none; }
.credit b { color: var(--fg); font-weight: 700; }
.credit .cl { color: var(--cyan); font-size: 12px; font-weight: 600; }
.credit:hover .cl { text-decoration: underline; }
.empty { text-align: center; padding: 26px 16px; }
.empty .ic { font-size: 42px; }
@media (prefers-reduced-motion: no-preference) {
  .pop { animation: pop .35s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes pop { from { transform: scale(.94); opacity: .4; } to { transform: none; opacity: 1; } }
}

  S.profile = { ...prev, nick: a.nick.trim().slice(0, 24), status: a.status, app: a.app, bedtime: a.bedtime, goals: a.goals || [], weak: a.weak || [], level: a.level || 'spicy', animal: a.animal || '🦉', origin: story, hidden: prev.hidden || [], createdAt: prev.createdAt || Date.now() };
  S.ob = null; S.tab = 'home';
  saveProfile(); savePlayer();
  render();
  if (!reported(today())) setTimeout(() => toast('First mission: your Damage Report.'), 400);
}

/* ---------------- boot ---------------- */
// Firebase: paste the web app config object here to switch on Google sign-in and the squad.
// Leave it null and the app runs in solo mode, saving to this phone only.
const FIREBASE_CONFIG = null;

function loadScript(src) { return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = rej; document.head.append(el); }); }
async function loadFirebase() {
  const v = '10.12.2', base = `https://www.gstatic.com/firebasejs/${v}/`;
  await loadScript(base + 'firebase-app-compat.js');
  await Promise.all([loadScript(base + 'firebase-auth-compat.js'), loadScript(base + 'firebase-firestore-compat.js')]);
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  return firebase;
}
async function googleSignIn() {
  try {
    const fb = S.fb || await loadFirebase();
    const provider = new fb.auth.GoogleAuthProvider();
    try { await fb.auth().signInWithPopup(provider); }
    catch (e) { if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) await fb.auth().signInWithRedirect(provider); else throw e; }
    location.reload();
  } catch (e) { if (!e || e.code !== 'auth/popup-closed-by-user') toast('Sign-in did not work. Try again.'); }
}
function startLocal() {
  const l = lsRead();
  S.profile = l && l.profile ? l.profile : null;
  S.logs = l && l.logs ? l.logs : { days: {} };
  S.uid = 'local'; S.online = false;
  render();
}
function renderSignIn() {
  tabsEl.hidden = true;
  app.replaceChildren(h('main', { class: 'ob splash' },
    h('div', { class: 'logo' }, 'Track your', h('span', null, 'downfall.')),
    h('p', { style: 'font-size:18px;font-weight:600' }, 'The habit tracker that roasts you until you get your life back.'),
    h('div', { class: 'stack', style: 'gap:10px' }, ['✅ 15-second tap-only check-ins', '💀 Personalised roasts (you pick the heat)', '🪦 A graveyard for every habit you kill', '🏆 Leaderboard and roast wall with friends'].map(t => h('div', { class: 'card', style: 'padding:12px 14px;font-weight:600' }, t))),
    h('button', { class: 'cta', onclick: googleSignIn }, 'Sign in with Google'),
    h('button', { class: 'cta ghost', onclick: () => { try { localStorage.setItem('tyd-solo', '1'); } catch {} startLocal(); } }, 'Use solo, no account'),
    h('p', { class: 'small muted' }, 'Signing in saves your data across phones and puts you on the squad leaderboard. Friends only ever see your nickname, animal, aura and rank.'),
    credit()));
}
async function boot() {
  let solo = false; try { solo = localStorage.getItem('tyd-solo') === '1'; } catch {}
  if (!FIREBASE_CONFIG) { startLocal(); return; }
  let fb;
  try { fb = await loadFirebase(); } catch { startLocal(); toast('Offline. Running in solo mode.'); return; }
  S.fb = fb;
  try { await fb.auth().getRedirectResult(); } catch {}
  fb.auth().onAuthStateChanged(u => {
    if (!u) { if (solo) startLocal(); else renderSignIn(); return; }
    if (S.uid === u.uid) return;
    try { localStorage.removeItem('tyd-solo'); } catch {}
    const db = fb.firestore();
    S.db = db; S.uid = u.uid; S.online = true;
    let gotP = false, gotL = false;
    const done = () => { if (gotP && gotL) render(); };
    db.doc(`data/users/${u.uid}/profile`).onSnapshot(s => { if (s.metadata.hasPendingWrites && gotP) return; S.profile = s.exists ? { ...s.data() } : (gotP ? S.profile : null); gotP = true; done(); }, () => { gotP = true; if (S.profile === undefined) S.profile = null; done(); });
    db.doc(`data/users/${u.uid}/logs`).onSnapshot(s => { if (s.metadata.hasPendingWrites && gotL) return; const d = s.exists ? s.data() : null; S.logs = d && d.days ? JSON.parse(JSON.stringify(d)) : S.logs; gotL = true; done(); }, () => { gotL = true; done(); });
    db.collection('players').onSnapshot(s => { S.players = s.docs.map(d => ({ id: d.id, ...d.data() })); if (!S.rep && !S.ob && S.profile && (S.tab === 'squad' || S.tab === 'home')) render(); renderWallList(); }, () => {});
    db.collection('roasts').orderBy('at', 'desc').limit(500).onSnapshot(s => { S.roasts = s.docs.map(d => ({ id: d.id, ...d.data() })); if (!S.rep && !S.ob && S.profile && !S.sheet) render(); else if (S.profile && !S.rep && !S.ob) renderTabs(); renderWallList(); }, () => {});
  });
}
// Refresh the day when the date rolls over while the app is open
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); if (!S.rep && !S.ob) render(); } }, 60000);
boot();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
